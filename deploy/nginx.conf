# Static export host for the BOLT XR Wallet.
#
# The export contains one route (`/`) plus hashed chunks under /_next/static and
# the MediaPipe runtime under /vendor. No SPA router, but try_files keeps deep
# links working if routes are added later.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A `types` block in a nested context REPLACES the inherited map instead of
    # extending it, so the stock map has to be pulled in here explicitly. Without
    # this line every .js/.css/.png goes out as application/octet-stream and a
    # nosniff browser refuses to execute the bundle.
    include /etc/nginx/mime.types;

    # nginx's mime.types does not reliably map .wasm; MediaPipe streams its
    # runtime, which needs the correct type or the browser refuses to compile it.
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/wasm
               image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;

    # Content-hashed build output and lockfile-pinned vendor assets.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # Unhashed files in public/ should revalidate rather than stick.
    location ~* \.(png|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    error_page 404 /index.html;
}
